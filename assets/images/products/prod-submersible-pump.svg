<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#ffffff" opacity="0.8"/>
  <!-- Pump Body -->
  <rect x="140" y="140" width="120" height="150" rx="12" fill="url(#pump)" stroke="#0f172a" stroke-width="3"/>
  <!-- Handle -->
  <path d="M170 140 L170 100 L230 100 L230 140" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  <!-- Outlet Elbow -->
  <path d="M260 200 L290 200 L290 160" fill="none" stroke="#64748b" stroke-width="18" stroke-linecap="square"/>
  <!-- Base Suction Grate -->
  <rect x="130" y="280" width="140" height="25" rx="4" fill="#0284c7"/>
  <line x1="145" y1="292" x2="255" y2="292" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- Float Switch Wire & Ball -->
  <path d="M230 160 C280 180 300 240 280 270" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="280" cy="270" r="14" fill="#f59e0b"/>
  <rect x="24" y="24" width="100" height="26" rx="6" fill="#0284c7" fill-opacity="0.1"/>
  <text x="74" y="41" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.5 HP DRAINAGE</text>
</svg>