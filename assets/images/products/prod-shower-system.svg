<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="bg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#ffffff" opacity="0.8"/>
  <!-- Shower Arm & Head -->
  <path d="M260 80 L160 80 L160 110 L260 110 Z" fill="url(#bronze)"/>
  <rect x="240" y="70" width="20" height="50" rx="4" fill="#78350f"/>
  <!-- Rainhead Plate -->
  <rect x="110" y="110" width="100" height="12" rx="3" fill="url(#bronze)"/>
  <!-- Water Droplets -->
  <line x1="125" y1="130" x2="125" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="145" y1="130" x2="145" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="165" y1="130" x2="165" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="185" y1="130" x2="185" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- Thermostatic Trim Plate -->
  <rect x="160" y="210" width="80" height="130" rx="8" fill="url(#bronze)"/>
  <circle cx="200" cy="245" r="16" fill="#78350f"/>
  <circle cx="200" cy="295" r="16" fill="#78350f"/>
  <rect x="24" y="24" width="120" height="26" rx="6" fill="#b45309" fill-opacity="0.1"/>
  <text x="84" y="41" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">THERMOSTATIC 38°</text>
</svg>