<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#ffffff" opacity="0.8"/>
  <!-- Tank Cylindrical Body -->
  <rect x="120" y="130" width="160" height="170" rx="16" fill="url(#tank)" stroke="#0c4a6e" stroke-width="3"/>
  <!-- Reinforcement Ribs -->
  <line x1="120" y1="170" x2="280" y2="170" stroke="#38bdf8" stroke-width="4"/>
  <line x1="120" y1="210" x2="280" y2="210" stroke="#38bdf8" stroke-width="4"/>
  <line x1="120" y1="250" x2="280" y2="250" stroke="#38bdf8" stroke-width="4"/>
  <!-- Threaded Lid Manhole -->
  <rect x="160" y="105" width="80" height="25" rx="6" fill="#0c4a6e"/>
  <!-- Inlet / Outlet Brass Fittings -->
  <circle cx="140" cy="150" r="8" fill="#f59e0b"/>
  <circle cx="260" cy="280" r="8" fill="#f59e0b"/>
  <rect x="24" y="24" width="100" height="26" rx="6" fill="#0284c7" fill-opacity="0.1"/>
  <text x="74" y="41" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">5-LAYER HDPE</text>
</svg>