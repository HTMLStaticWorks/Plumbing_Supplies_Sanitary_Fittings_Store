<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#ffffff" opacity="0.8"/>
  <!-- Angle Valve Body -->
  <path d="M150 180 L250 180 L250 220 L210 220 L210 290 L170 290 L170 220 L150 220 Z" fill="url(#brass)" stroke="#8c6200" stroke-width="3"/>
  <!-- Horizontal Thread -->
  <rect x="130" y="185" width="20" height="30" rx="3" fill="url(#chrome)"/>
  <line x1="135" y1="185" x2="135" y2="215" stroke="#475569" stroke-width="2"/>
  <line x1="142" y1="185" x2="142" y2="215" stroke="#475569" stroke-width="2"/>
  <!-- Vertical Thread -->
  <rect x="165" y="290" width="50" height="20" rx="3" fill="url(#chrome)"/>
  <line x1="165" y1="297" x2="215" y2="297" stroke="#475569" stroke-width="2"/>
  <line x1="165" y1="304" x2="215" y2="304" stroke="#475569" stroke-width="2"/>
  <!-- Valve Stem & Knob -->
  <rect x="180" y="120" width="20" height="60" fill="url(#chrome)"/>
  <!-- Red Lever Knob -->
  <rect x="130" y="95" width="120" height="28" rx="14" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <circle cx="190" cy="109" r="6" fill="#f8fafc"/>
  <!-- Spec Badge -->
  <rect x="24" y="24" width="90" height="26" rx="6" fill="#0284c7" fill-opacity="0.1"/>
  <text x="69" y="41" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PN16 DZR</text>
</svg>